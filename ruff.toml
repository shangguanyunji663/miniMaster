# miniMaster lint 配置
target-version = "py312"
line-length = 100
extend-exclude = [".conda", "workspaces", "runs"]

[lint]
select = [
    "E4", "E7", "E9",  # pycodestyle 关键错误
    "F",               # pyflakes
    "W",               # warning
    "I",               # isort 导入排序
    "UP",              # pyupgrade
    "B",               # bugbear
    "SIM",             # simplify
]

[lint.per-file-ignores]
# 测试里的断言辅助/夹具允许未使用变量与长参数
"tests/*" = ["B011"]
