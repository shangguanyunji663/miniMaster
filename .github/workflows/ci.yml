name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: 单元测试（无需 API Key）
        run: pytest tests/ -q --cov=minimaster --cov-report=term

      - name: 覆盖率
        if: runner.os == 'Linux'
        run: pytest tests/ -q --cov=minimaster --cov-report=term > coverage.txt; tail -30 coverage.txt
